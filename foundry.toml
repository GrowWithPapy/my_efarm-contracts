[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
# The token is meant to be read by people and by scanners, so keep the metadata hash:
# it is what lets Etherscan and Sourcify match deployed bytecode back to this source.
bytecode_hash = "ipfs"
cbor_metadata = true

# Deterministic, exhaustive tests beat a lucky seed.
[fuzz]
runs = 512

[profile.ci]
fuzz = { runs = 4096 }
verbosity = 3

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base = "${BASE_RPC_URL}"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532 }
base = { key = "${BASESCAN_API_KEY}", chain = 8453 }
